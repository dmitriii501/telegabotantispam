name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]  # the oldest and a recent Python the server may have
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (Tesseract for the picture tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      - name: Install
        run: pip install -r requirements-dev.txt -c constraints.txt ruff mypy
      - name: Lint
        run: ruff check core adapters webapp main.py scripts tests
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q
